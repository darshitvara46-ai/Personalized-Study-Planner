<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Personalized Study Planner</title>

  <link rel="stylesheet" href="signup.css">
</head>

<body>

  <div class="signup-card">
    <h1 class="signup-title">Sign Up</h1>
    <div class="marquee-container">
      <p class="signup-subtitle">Join thousands of students staying ahead with Personalized study planner.</p>
    </div>

    <form class="signup-form" id="signupForm">

      <div class="input-group">
        <label for="email" class="input-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter password" required>
          <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
        <div id="passwordError" style="color: red; font-size: 0.9rem; margin-top: 5px;"></div>
      </div>

      <div class="input-group">
        <label for="confirmPassword" class="input-label">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" class="form-input" placeholder="Enter confirm password" required>
          <button type="button" class="toggle-password" id="toggleConfirmPasswordBtn" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
        <div id="confirmPasswordError" style="color: red; font-size: 0.9rem; margin-top: 5px;"></div>
      </div>

      <button type="submit" class="submit-btn">Continue</button>
    </form>

    <div class="divider">or sign up with</div>

    <div class="signup-footer">
      Already have an account? <a href="login.html" class="login-link">Sign in</a>
    </div>
  </div>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Inline Script -->
  <script>
    console.log("hello");
    const supabaseUrl = "https://mitobngigufknrijzhxq.supabase.co";
    const supabaseKey = "sb_publishable_qxAqMx5EMNIAoNUzyNm_UQ_JXX3Gu6E";

    // Renamed variable to 'supabaseClient' to avoid identifier collision
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      const passwordError = document.getElementById("passwordError");
      const confirmPasswordError = document.getElementById("confirmPasswordError");

      if (passwordError) passwordError.textContent = "";
      if (confirmPasswordError) confirmPasswordError.textContent = "";

      if (password !== confirmPassword) {
        if (confirmPasswordError) {
          confirmPasswordError.textContent = "Passwords do not match.";
        } else {
          alert("Passwords do not match.");
        }
        return;
      }

      if (password.length < 6) {
        if (passwordError) {
          passwordError.textContent = "Password must be at least 6 characters long.";
        } else {
          alert("Password must be at least 6 characters long.");
        }
        return;
      }

      // Using supabaseClient here
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        console.error("Signup error:", error.message);
        alert("Sign up failed: " + error.message);
      } else {
        console.log("Signup response data:", data);
        alert("Signup successful! Redirecting to login page...");
        window.location.href = "login.html";
      }
    });

    function setupPasswordToggle(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);
      if (input && button) {
        button.addEventListener("click", () => {
          const type = input.getAttribute("type") === "password" ? "text" : "password";
          input.setAttribute("type", type);
        });
      }
    }

    setupPasswordToggle("password", "togglePasswordBtn");
    setupPasswordToggle("confirmPassword", "toggleConfirmPasswordBtn");
  </script>

</body>
</html>
