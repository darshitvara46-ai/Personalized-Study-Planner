<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Personalized Study Planner</title>
  
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-card">
    <h1 class="login-title">Log-in</h1>
    <div class="marquee-container">
      <p class="login-subtitle">Built for busy students like you.</p>
    </div>

    <form class="login-form" id="loginForm">
    
      <div class="input-group">
        <label for="email" class="input-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
      </div>

    
      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter password" required>
          
          <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
            
          </button>
        </div>
      </div>

    
      <div class="forgot-password-container">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      
      <button type="submit" class="submit-btn">Continue</button>
    </form>

    
    <div class="divider">or sign in with</div>
    

    
    <div class="login-footer">
      Don't have an account? <a href="signup.html" class="signup-link">Sign Up</a>
    </div>
  </div>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Inline Logic Script -->
  <script>
    const supabaseUrl = "https://mitobngigufknrijzhxq.supabase.co";
    const supabaseKey = "sb_publishable_qxAqMx5EMNIAoNUzyNm_UQ_JXX3Gu6E";

    // Renamed to avoid identifier collision with window.supabase
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePasswordBtn.classList.toggle('visible');
      });
    }

    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const emailValue = document.getElementById('email').value.trim();
        const passwordValue = document.getElementById('password').value;

        console.log("Attempting login for:", emailValue);

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: emailValue,
          password: passwordValue
        });

        if (error) {
          console.error("Login Error:", error.message);
          alert("Login failed: " + error.message);
        } else {
          console.log("Login Successful:", data);
          alert("Welcome back!");
          window.location.href = "index.html";
        }
      });
    }
  </script>
  
</body>
</html>
