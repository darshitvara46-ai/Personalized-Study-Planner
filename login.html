<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Personalized Study Planner</title>
  
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-card">
    <h1 class="login-title">Sign in</h1>
    <div class="marquee-container">
    <p class="login-subtitle">Built for busy students like you.</p>
    </div>

    <form class="login-form" id="loginForm">
    
      <div class="input-group">
        <label for="email" class="input-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
      </div>

    
      <div class="input-group">
        <label for="password" class="input-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter password" required>
          
          <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

    
      <div class="forgot-password-container">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      
      <button type="submit" class="submit-btn">Continue</button>
    </form>

    
    <div class="divider">or sign in with</div>

    
    <div class="social-login-row">
    
      <a href="#" class="social-btn google-btn" aria-label="Sign in with Google">
         <img src="google.png" alt="Google logo" style="width: 24px; height:24px;">
      </a>

      
      <a href="#" class="social-btn apple-btn" aria-label="Sign in with Apple">
         <img src="apple.png" alt="Apple logo" style="width: 24px; height:24px;"> 
      </a>
    </div>

    
    <div class="login-footer">
      Don't have an account? <a href="signup.html" class="signup-link">Sign Up</a>
    </div>
  </div>

  
  <script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    togglePasswordBtn.addEventListener('click', () => {
      
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePasswordBtn.classList.toggle('visible');
    });

    
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
